[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bot-stockfish"
version = "0.1.2"
description = "Stockfish-backed Wild 16 Kriegspiel bot"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Kriegspiel"}]
dependencies = [
    "chess>=1.11.2",
    "requests>=2.32.0",
]

[project.scripts]
stockfish-bot = "stockfish_bot.api:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
